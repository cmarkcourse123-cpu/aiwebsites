<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreamlinePro - Modern SaaS Solutions</title>
<style>
  :root {
    --primary-color: #4f46e5;
    --secondary-color: #6366f1;
    --accent-color: #818cf8;
    --background-color: #f9fafb;
    --text-color: #111827;
    --text-light: #6b7280;
    --border-radius: 8px;
    --max-width: 1200px;
    --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background-color: var(--background-color);
    color: var(--text-color);
    line-height: 1.6;
  }
  img {
    max-width: 100%;
    display: block;
  }
  a {
    color: var(--primary-color);
    text-decoration: none;
  }
  header, section {
    padding: 60px 20px;
  }
  .container {
    max-width: var(--max-width);
    margin: 0 auto;
  }
  /* Hero */
  .hero {
    background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
    color: white;
    text-align: center;
    padding: 120px 20px 100px;
  }
  .hero h1 {
    font-size: 2.75rem;
    font-weight: 700;
    margin-bottom: 20px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }
  .hero p {
    font-size: 1.25rem;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 40px;
    color: rgba(255 255 255 / 0.85);
  }
  .hero .btn-primary {
    background-color: white;
    color: var(--primary-color);
    padding: 16px 32px;
    font-weight: 600;
    border-radius: var(--border-radius);
    box-shadow: 0 4px 14px rgb(255 255 255 / 0.4);
    transition: background-color 0.3s ease, color 0.3s ease;
    display: inline-block;
  }
  .hero .btn-primary:hover,
  .hero .btn-primary:focus {
    background-color: #ecebff;
    color: var(--secondary-color);
  }

  /* Features */
  .features {
    background-color: white;
    text-align: center;
  }
  .features h2 {
    font-size: 2.5rem;
    margin-bottom: 40px;
  }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 30px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .feature-item {
    background: #f3f4fd;
    border-radius: var(--border-radius);
    padding: 30px 25px;
    box-shadow: 0 6px 15px rgb(79 70 229 / 0.1);
    transition: box-shadow 0.3s ease;
  }
  .feature-item:hover {
    box-shadow: 0 10px 30px rgb(79 70 229 / 0.2);
  }
  .feature-item h3 {
    font-size: 1.25rem;
    margin-bottom: 15px;
    color: var(--primary-color);
  }
  .feature-item p {
    color: var(--text-light);
    font-size: 1rem;
  }

  /* Benefits */
  .benefits {
    background-color: var(--background-color);
    text-align: center;
  }
  .benefits h2 {
    font-size: 2.5rem;
    margin-bottom: 40px;
  }
  .benefits-list {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
  }
  .benefit-item {
    background: white;
    border-radius: var(--border-radius);
    padding: 25px 30px;
    box-shadow: 0 4px 20px rgb(0 0 0 / 0.05);
    flex: 1 1 280px;
    max-width: 300px;
    text-align: left;
  }
  .benefit-item h3 {
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: var(--secondary-color);
  }
  .benefit-item p {
    color: var(--text-light);
    font-size: 0.95rem;
    line-height: 1.4;
  }

  /* Testimonials */
  .testimonials {
    background-color: white;
    text-align: center;
    padding-bottom: 80px;
  }
  .testimonials h2 {
    font-size: 2.5rem;
    margin-bottom: 50px;
  }
  .testimonial-list {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    justify-content: center;
  }
  .testimonial-item {
    background: #f3f4fd;
    border-radius: var(--border-radius);
    padding: 30px 25px;
    box-shadow: 0 4px 20px rgb(0 0 0 / 0.05);

    position: relative;
    flex: 1 1 300px;
  }
  .testimonial-item::before {
    content: "“";
    font-size: 3rem;
    color: var(--accent-color);
    position: absolute;
    top: 15px;
    left: 20px;
    font-weight: 700;
  }
  .testimonial-text {
    margin-bottom: 20px;
    font-style: italic;
    color: var(--text-color);
  }
  .testimonial-author {
    font-weight: 600;
    color: var(--primary-color);
  }
  .testimonial-role {
    font-size: 0.875rem;
    color: var(--text-light);
  }

  /* Pricing */
  .pricing {
    background-color: var(--background-color);
    text-align: center;
  }
  .pricing h2 {
    font-size: 2.5rem;
    margin-bottom: 50px;
  }
  .pricing-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .card {
    background: white;
    border-radius: var(--border-radius);
    box-shadow: 0 8px 25px rgb(0 0 0 / 0.05);
    padding: 40px 30px 50px;
    flex: 1 1 280px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: box-shadow 0.3s ease;
  }
  .card:hover {
    box-shadow: 0 12px 40px rgb(79 70 229 / 0.2);
  }
  .card h3 {
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: var(--primary-color);
  }
  .card .price {
    font-size: 2.25rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: var(--secondary-color);
  }
  .card ul {
    list-style: none;
    padding: 0;
    margin-bottom: 35px;
    color: var(--text-light);
    font-size: 1rem;
    line-height: 1.5;
  }
  .card ul li {
    margin-bottom: 12px;
  }
  .card .btn-secondary {
    background-color: var(--primary-color);
    color: white;
    text-align: center;
    padding: 15px 0;
    font-weight: 600;
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: background-color 0.3s ease;
    text-decoration: none;
  }
  .card .btn-secondary:hover,
  .card .btn-secondary:focus {
    background-color: var(--secondary-color);
  }

  /* Contact */
  .contact {
    background-color: white;
    padding-bottom: 90px;
  }
  .contact h2 {
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 40px;
    color: var(--primary-color);
  }
